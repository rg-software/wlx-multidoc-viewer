name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── Windows (self-hosted, requires VS 2026 + vcpkg) ──────────────
  build-windows:
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      # Capture VCPKG_ROOT from the system env before ilammy/msvc-dev-cmd
      # overwrites it with the VS-bundled vcpkg (which is stale). We re-apply
      # the saved value via step env on every build so the preset's
      # $env{VCPKG_ROOT} resolves to the intended vcpkg. Mirrors the working
      # pattern in wlx-edge-viewer.
      - name: Get VCPKG_ROOT
        id: vcpkg-root
        shell: pwsh
        run: echo "value=$env:VCPKG_ROOT" >> $env:GITHUB_OUTPUT

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 release
        shell: cmd
        env:
          VCPKG_ROOT: ${{ steps.vcpkg-root.outputs.value }}
        run: |
          echo VCPKG_ROOT=%VCPKG_ROOT%
          cmake --preset windows-x64-release
          cmake --build --preset windows-release

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build x86 release
        shell: cmd
        env:
          VCPKG_ROOT: ${{ steps.vcpkg-root.outputs.value }}
        run: |
          echo VCPKG_ROOT=%VCPKG_ROOT%
          cmake --preset windows-x86-release
          cmake --build --preset windows-x86-release

      - name: Package
        shell: cmd
        run: |
          mkdir dist\release
          copy build\release\Release\MultidocViewer.wlx64 dist\release\
          copy build\release-x86\Release\MultidocViewer.wlx dist\release\
          copy pluginst.inf dist\release\

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/release/

  # ── Linux (GitHub-hosted ubuntu) ─────────────────────────────────
  build-linux:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_INSTALLED: ${{ github.workspace }}/build/vcpkg_installed
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4.x
        run: |
          wget -q https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz
          sudo tar -xzf cmake-4.4.3-linux-x86_64.tar.gz -C /opt
          echo "/opt/cmake-4.4.3-linux-x86_64/bin" >> "$GITHUB_PATH"
          cmake --version

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            qt6-base-dev libgl1-mesa-dev \
            libdjvulibre-dev \
            libchm-dev \
            libarchive-dev

      # The distro libmupdf-dev (1.23.10 on ubuntu-24.04) predates the
      # FZ_STEXT_ACCURATE_BBOXES flag (MuPDF 1.25+) the viewer uses for precise
      # text selection, and the viewer pins MuPDF 1.28.3 elsewhere. Use vcpkg
      # (the same pipeline the Windows build uses) to build the overlay
      # libmupdf 1.28.3 and its deps, giving byte-identical MuPDF on Linux.
      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build MuPDF 1.28.3 (vcpkg, shared)
        run: |
          # Build libmupdf as a shared library so the project's Linux
          # find_library path links a self-contained .so (no need to also
          # carry libmupdf's static transitive deps, mirroring the old
          # system-shared-lib model). --classic bypasses the repo's manifest
          # mode so we can install just this one port. The -dynamic triplet
          # suffix selects shared linking.
          "$VCPKG_ROOT/vcpkg" install --classic \
            --x-install-root="$VCPKG_INSTALLED" \
            --overlay-ports=overlay-ports \
            --triplet=x64-linux-dynamic \
            libmupdf

      - name: Configure project (links built MuPDF)
        run: |
          # VCPKG_MANIFEST_MODE=OFF: the vcpkg.json manifest lists all libs
          # (incl. Qt6), but on Linux we only want the pre-built MuPDF from
          # vcpkg; the rest come from system packages. Disabling manifest mode
          # stops the toolchain from auto-installing the whole manifest.
          cmake --preset linux-release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DVCPKG_OVERLAY_PORTS="$PWD/overlay-ports" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED"

      - name: Build release
        run: |
          cmake --build --preset linux-release

      - name: Package
        run: |
          mkdir -p dist/linux-release
          cp build/linux-release/MultidocViewer.wlx64 dist/linux-release/
          cp pluginst.inf dist/linux-release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux-release/

  # ── Create GitHub Release ────────────────────────────────────────
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # Need full history + tags to diff commits between the previous and
      # current release tags for the summary.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Build a human summary from the commit log between the previous tag and
      # this one, grouped by conventional-commit prefix into bold sections
      # (no emoji). This repo lands changes as direct commits to master (no
      # PRs), so GitHub's label-based auto-changer cannot categorize anything.
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          CUR="$GITHUB_REF_NAME"
          PREV="$(git describe --tags --abbrev=0 "$CUR"^ 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$CUR"
            LOG="$(git log --format=%s $RANGE)"
          else
            RANGE=""
            LOG="$(git log --format=%s)"
          fi

          : > notes.md
          if echo "$LOG" | grep -qiE '^feat(\(.*\))?:' ; then
            echo '**New features**' >> notes.md
            echo "$LOG" | grep -iE '^feat(\(.*\))?:' | sed 's/^/- /' >> notes.md
            echo >> notes.md
          fi
          if echo "$LOG" | grep -qiE '^fix(\(.*\))?:' ; then
            echo '**Bugfixes**' >> notes.md
            echo "$LOG" | grep -iE '^fix(\(.*\))?:' | sed 's/^/- /' >> notes.md
            echo >> notes.md
          fi
          if echo "$LOG" | grep -vqiE '^(feat|fix)(\(.*\))?:' ; then
            echo '**Other Changes**' >> notes.md
            echo "$LOG" | grep -viE '^(feat|fix)(\(.*\))?:' | sed 's/^/- /' >> notes.md
          fi
          if [ -n "$PREV" ]; then
            echo >> notes.md
            echo "Full Changelog: [$PREV...$CUR](https://github.com/${{ github.repository }}/compare/$PREV...$CUR)" >> notes.md
          fi

          # Trim any leading blank lines the pipeline may have left.
          sed -i '/./,$!d' notes.md
          wc -l notes.md

      - name: Package release zips
        run: |
          cd artifacts
          # Windows: both .wlx64 + .wlx + pluginst.inf in one zip
          cd windows-binaries
          zip -r ../../wlx-multidoc-viewer-Windows.zip .
          cd ../linux-binaries
          zip -r ../../wlx-multidoc-viewer-Linux.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/wlx-multidoc-viewer-Windows.zip
            artifacts/wlx-multidoc-viewer-Linux.zip
