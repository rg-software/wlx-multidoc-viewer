[Viewer]
; Chrome theme: light | dark | auto. "auto" follows the host's mode
; (Total Commander's dark-mode flag on Windows, the Qt color scheme on Linux).
Theme = auto

; Initial width of the outline sidebar in logical pixels
SidebarWidth = 180

; Whether a document with an outline opens with the sidebar shown
SidebarVisible = false

; ---------------------------------------------------------------------------
; Chrome palette per theme. Values are #RRGGBB or #RRGGBBAA (alpha); the '#'
; prefix is optional and hex is case-insensitive. Any missing key falls back to
; the built-in default, so a partial section is fine. The selection/search
; overlays are normally identical in both themes.
; ---------------------------------------------------------------------------

[Theme:light]
PageBackground = #E8E8E8
SidebarBackground = #E8E8E8
ToolbarBackground = #F0F0F0
ToolbarCheckedTint = #E4EFFB
ToolbarCheckedRing = #9ABEE0
Glyph = #4A4A4A
TreeText = #202020
EditBackground = #FFFFFF
EditText = #000000
SelectionFill = #FFF06969
SearchActiveFill = #00DCDC96
SearchActivePen = #008282FF

[Theme:dark]
PageBackground = #1E1E1E
SidebarBackground = #2B2B2B
ToolbarBackground = #333333
ToolbarCheckedTint = #2E455E
ToolbarCheckedRing = #6E94BD
Glyph = #D6D6D6
TreeText = #E0E0E0
EditBackground = #1F1F1F
EditText = #E0E0E0
SelectionFill = #FFF06969
SearchActiveFill = #00DCDC96
SearchActivePen = #008282FF
