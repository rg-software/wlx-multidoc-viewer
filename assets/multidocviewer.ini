[Viewer]
; Chrome theme: light | dark | auto. "auto" follows the host's mode
; (Total Commander's dark-mode flag on Windows, the Qt color scheme on Linux).
Theme = auto

; Initial width of the outline sidebar in logical pixels
SidebarWidth = 180

; Whether a document with an outline opens with the sidebar shown
SidebarVisible = false

; Font size for reflowable documents (EPUB/MOBI/HTML/FB2), in points. It sets
; characters per line (smaller = more per line) and re-flows the document, so it
; also changes the page count; it is not a raster zoom. Clamped to 8..32.
; Restart the host after changing it.
FontSize = 11

; Startup view mode: false opens continuous scrolling, true opens paged mode
; (one unit per screen). Applied to each new lister window; the toolbar
; Paged/Continuous toggle overrides it for that window at runtime.
PagedMode = false

; Startup fit mode: page | width | manual. "page" fits the whole current unit,
; "width" fits the widest page row to the window width, "manual" starts at 100%
; zoom (no autofit). Applied per document open; the toolbar Fit button cycles
; through the same three states at runtime.
FitMode = page

; CHM topic stylesheet. By default the plugin reads "chm.css" from its own
; directory (shipped next to the binary; edit that file in place, or set ChmCss
; to use a different one). A relative name is resolved against the plugin
; directory. The file replaces the built-in CHM layout rules (theme colors are
; applied first), so it can fully retune CHM rendering: body size, code/table
; styling, wrapping, etc. The tokens @document-bg@, @document-text@, @surface@
; and @border@ are replaced from the active theme palette. Read once at
; startup — restart the host after editing.
; ChmCss = my-chm.css

; ---------------------------------------------------------------------------
; Chrome palette per theme. Values are #RRGGBB or #RRGGBBAA (alpha); the '#'
; prefix is optional and hex is case-insensitive. Any missing key falls back to
; the built-in default, so a partial section is fine. The selection/search
; overlays are normally identical in both themes.
; ---------------------------------------------------------------------------

[Theme:light]
PageBackground = #E8E8E8
SidebarBackground = #E8E8E8
ToolbarBackground = #F0F0F0
ToolbarCheckedTint = #E4EFFB
ToolbarCheckedRing = #9ABEE0
Glyph = #4A4A4A
TreeText = #202020
EditBackground = #FFFFFF
EditText = #000000
SelectionFill = #FFF06969
SearchActiveFill = #00DCDC96
SearchActivePen = #008282FF

; Document body (reflowable text and background-neutral fixed-layout pages)
DocumentBackground = #FFFFFF
DocumentText = #000000

[Theme:dark]
PageBackground = #1E1E1E
SidebarBackground = #2B2B2B
ToolbarBackground = #333333
ToolbarCheckedTint = #2E455E
ToolbarCheckedRing = #6E94BD
Glyph = #D6D6D6
TreeText = #E0E0E0
EditBackground = #1F1F1F
EditText = #E0E0E0
SelectionFill = #FFF06969
SearchActiveFill = #00DCDC96
SearchActivePen = #008282FF

; Document body (reflowable text and background-neutral fixed-layout pages)
DocumentBackground = #262626
DocumentText = #E0E0E0
