; WLX Multi-Document Viewer - configuration
; This file sits next to the plugin binary (MultidocViewer.wlx64 / .wlx).
; It is read once at first access and cached for the process lifetime;
; a viewer restart is required after editing.

[Viewer]
; Page-area background color as a hex RGB value. The leading '#' is
; optional and the value is case-insensitive (e.g. #E8E8E8 or E8E8E8).
; If the key is absent or malformed, the default 0xE8E8E8 is used.
; BackgroundColor=#E8E8E8