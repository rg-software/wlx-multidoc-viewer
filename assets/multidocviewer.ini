; WLX Multi-Document Viewer - configuration
; This file sits next to the plugin binary (MultidocViewer.wlx64 / .wlx).
; It is read once at first access and cached for the process lifetime;
; a viewer restart is required after editing.

[Viewer]
; Page-area background color as a hex RGB value. The leading '#' is
; optional and the value is case-insensitive (e.g. #E8E8E8 or E8E8E8).
; If the key is absent or malformed, the default 0xE8E8E8 is used.
; BackgroundColor=#E8E8E8

; Initial width of the outline sidebar in logical pixels (scaled to device
; pixels by the display DPI). Values below the 80 px minimum are clamped up.
; The width the user drags to is kept only for the current viewer session and
; never written back. If absent or malformed, the 180 px default is used.
; SidebarWidth=180

; Whether a document with an outline opens with the sidebar shown. Toggling
; the sidebar during a session is never overridden. If absent, the default is
; false (sidebar hidden until toggled).
; SidebarVisible=false